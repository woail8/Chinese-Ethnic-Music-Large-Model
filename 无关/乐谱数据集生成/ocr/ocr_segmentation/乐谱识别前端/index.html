<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>简谱识别</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; color: #111; }
      .card { max-width: 980px; margin: 0 auto; }
      h1 { font-size: 20px; margin: 0 0 16px; }
      form { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      input[type="file"] { padding: 6px; }
      button { padding: 8px 14px; cursor: pointer; }
      .error { color: #b00020; margin: 12px 0; }
      .grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 16px; }
      @media (min-width: 980px) { .grid { grid-template-columns: 1fr 1fr; } }
      pre { background: #f6f7f9; padding: 12px; border-radius: 8px; overflow: auto; min-height: 220px; }
      img { max-width: 100%; height: auto; border: 1px solid #eee; border-radius: 8px; }
      .hint { color: #555; font-size: 13px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>简谱图片识别</h1>
      <form action="/recognize" method="post" enctype="multipart/form-data">
        <input type="file" name="file" accept="image/*" required />
        <button type="submit">开始识别</button>
      </form>

      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}

      <div class="grid">
        <div>
          <div class="hint">识别输出序列</div>
          <pre>{{ sequence or "" }}</pre>
          {% if sid %}
            <div class="hint"><a href="/editor/{{ sid }}">进入手动纠错</a></div>
          {% endif %}
        </div>
        <div>
          <div class="hint">处理后图片（用于核对）</div>
          {% if image_url %}
            <img src="{{ image_url }}" alt="processed" />
          {% else %}
            <div class="hint">上传图片后会显示处理结果图。</div>
          {% endif %}
        </div>
      </div>

      <div class="hint">
        输出文本会写入 output/score 目录；验证图片会写入 output/web 目录。
      </div>
    </div>
  </body>
</html>
